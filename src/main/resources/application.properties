spring.application.name=givenergy
server.port=8081

# Create a token at https://www.givenergy.cloud -> Account Settings -> Manage API Tokens
# (needs at least the api:inverter:read scope). Supply it via the GIVENERGY_API_TOKEN env var.
givenergy.api-token=${GIVENERGY_API_TOKEN:}
# Optional: leave blank to use the first inverter on the account.
givenergy.inverter-serial=${GIVENERGY_INVERTER_SERIAL:}
# How often to log the battery status; 0 disables. The cloud data updates roughly every 5 minutes.
givenergy.poll-interval=5m

management.endpoints.web.exposure.include=health,info
