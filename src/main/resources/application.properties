spring.application.name=givenergy
server.port=8081

# Create a token at https://www.givenergy.cloud -> Account Settings -> Manage API Tokens
# (needs at least the api:inverter:read scope). Supply it via the GIVENERGY_API_TOKEN env var.
givenergy.api-token=${GIVENERGY_API_TOKEN:}
# Optional: leave blank to use the first inverter on the account.
givenergy.inverter-serial=${GIVENERGY_INVERTER_SERIAL:}
# How often to log the battery status; 0 disables. The cloud data updates roughly every 5 minutes.
givenergy.poll-interval=5m
# Days for the daily summary are midnight-to-midnight in this zone; the summary of yesterday runs at 00:00 here.
givenergy.timezone=Europe/London

# Grid export and import history is stored per day in the gridExports and gridImports collections:
# back-filled at startup, then yesterday is fetched at 00:30 local time each night.
#givenergy.grid-history.sync-on-startup=true
#givenergy.grid-history.cron=0 30 0 * * *
# Tariff used to value newly stored days, in pence. Each day keeps the prices from when it was first
# written, so changing these does not revalue history. Import is time-of-use: the off-peak rate applies
# from off-peak-start to off-peak-end (local time). standing-charge-pence is the supplier's daily charge.
# The off-peak/peak split is stored per day, so after changing the window run POST /api/grid/sync?from=<date>.
givenergy.tariff.export-pence=16.5
givenergy.tariff.import-peak-pence=36.48
givenergy.tariff.import-off-peak-pence=6.6
givenergy.tariff.off-peak-start=23:30
givenergy.tariff.off-peak-end=05:30
givenergy.tariff.standing-charge-pence=0
# Alert when the battery is still below this percent in the four hours after the off-peak window. 0 disables it.
givenergy.alerts.low-soc-percent=20

# Two scheduler threads so the startup back-fill doesn't hold up the battery poller.
spring.task.scheduling.pool.size=2

# Battery readings are recorded in the batteryReadings collection of this database.
spring.mongodb.uri=${MONGODB_URI:mongodb://storenator.bluelarma.com:27017/givenergy}

management.endpoints.web.exposure.include=health,info
